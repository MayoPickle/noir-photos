services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noir
      POSTGRES_PASSWORD: noir
      POSTGRES_DB: noir
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noir -d noir"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noir
      MINIO_ROOT_PASSWORD: noirpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/cors.json:/etc/noir/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 noir noirpassword &&
      mc mb -p local/noir-photos &&
      mc anonymous set none local/noir-photos &&
      mc cors set local/noir-photos /etc/noir/cors.json
      "

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      NOIR_DATABASE_URL: postgresql+psycopg://noir:noir@postgres:5432/noir
      NOIR_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
