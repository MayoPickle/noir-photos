[project]
name = "noir-photos-api"
version = "0.1.0"
description = "FastAPI backend for Noir Photos end-to-end encrypted photo storage."
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "PyNaCl>=1.6",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
